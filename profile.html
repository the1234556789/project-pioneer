<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 | Project Pioneer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#0f0f0f;color:#fff;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#181818;position:sticky;top:0;z-index:99;gap:12px;flex-wrap:wrap;}
.logo{font-size:22px;font-weight:bold;color:#fff;text-decoration:none}
.nav a{color:#ddd;text-decoration:none;margin:0 10px;padding:6px 10px;border-radius:6px}
.nav a:hover{background:#272727}
.search-input{padding:8px 12px;border:none;border-radius:4px;width:200px;background:#121212;color:#fff;border:1px solid #333}
.user-area{display:flex;align-items:center;gap:8px}
.u-avatar{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-decoration:none}
.u-name{font-size:14px}
.btn-out{padding:4px 10px;border:1px solid #ccc;background:#272727;color:#fff;border-radius:12px;cursor:pointer;font-size:12px}
.container{max-width:960px;margin:30px auto;padding:0 20px}
.user-card{background:#181818;border-radius:12px;padding:24px;margin-bottom:24px}
.username{font-size:26px;font-weight:bold;margin-bottom:8px}
.desc{color:#aaa;margin-bottom:16px}
.btn-share{padding:8px 16px;background:#448aff;border:none;color:#fff;border-radius:6px;cursor:pointer}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.video-card{background:#181818;border-radius:10px;overflow:hidden;cursor:pointer}
.video-card .thumb{height:146px;background:#222}
.video-card .info{padding:12px}
.video-card h4{margin-bottom:4px;color:#fff}
.video-card p{color:#aaa;font-size:13px}
.toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fff;padding:16px 28px;border-radius:10px;font-size:14px;z-index:9999;text-align:center;max-width:360px;cursor:pointer}
.cover{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
.cover.show{display:flex}
.popup{background:#181818;color:#fff;border-radius:10px;padding:20px;width:340px}
.popup h2{margin:0 0 15px 0;font-size:16px}
.tabs{display:flex;margin-bottom:15px;border-bottom:1px solid #333}
.tab{flex:1;text-align:center;padding:8px;cursor:pointer;color:#aaa;border-bottom:2px solid transparent;font-size:14px}
.tab.on{color:#448aff;border-bottom-color:#448aff;font-weight:bold}
.page{display:none}
.page.on{display:block}
.popup input{width:100%;padding:8px;margin-bottom:10px;border:1px solid #333;background:#111;color:#fff;border-radius:6px;box-sizing:border-box;font-size:14px}
.popup button.go{width:100%;padding:9px;background:#448aff;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.err{color:#ff5252;font-size:12px;min-height:14px;margin-bottom:8px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="cover" id="pop"><div class="popup"><h2>账号</h2><div class="tabs"><div class="tab on" onclick="swTab('login')">登录</div><div class="tab" onclick="swTab('reg')">注册</div></div><div class="page on" id="pg-login"><div class="err" id="e-login"></div><input id="l-user" placeholder="用户名 / 邮箱"><input id="l-pw" type="password" placeholder="密码"><button class="go" onclick="doLogin()">登录</button></div><div class="page" id="pg-reg"><div class="err" id="e-reg"></div><input id="r-mail" placeholder="邮箱"><input id="r-name" placeholder="昵称"><input id="r-phone" placeholder="手机号（可选）"><input id="r-pw" type="password" placeholder="密码（至少6位）"><button class="go" onclick="doSend()">发送验证码</button><div class="tip" id="v-tip" style="display:none"></div><input id="r-code" placeholder="6位验证码" style="display:none"><button class="go" id="r-go" onclick="doReg()" style="display:none">完成注册</button></div></div></div>

<header>
<a class="logo" href="index.html">Project Pioneer</a>
<div class="nav"><a href="index.html">首页</a><a href="upload.html">上传视频</a></div>
<div class="user-area" id="abar"></div>
</header>

<div class="container">
<div class="user-card">
<div class="username" id="showName">加载中...</div>
<div class="desc" id="showDesc">暂无简介</div>
<button class="btn-share" onclick="shareChannel()">分享此频道</button>
</div>
<h3 style="margin-bottom:16px;">作品列表</h3>
<div class="video-grid" id="videoList"></div>
</div>

<script>
const STORAGE_USER_KEY="pp_user",STORAGE_USERS_LIST="pp_users",STORAGE_VIDEOS="pp_videos";
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';t.onclick=()=>{t.style.display='none'};clearTimeout(window.__tt);window.__tt=setTimeout(()=>{t.style.display='none'},3000);}
function getLoginUser(){const r=localStorage.getItem(STORAGE_USER_KEY);return r?JSON.parse(r):null;}
function saveLoginUser(u){if(u)localStorage.setItem(STORAGE_USER_KEY,JSON.stringify(u));else localStorage.removeItem(STORAGE_USER_KEY);renderBar();}
function getUsers(){const r=localStorage.getItem(STORAGE_USERS_LIST);return r?JSON.parse(r):[];}
function saveUsers(l){localStorage.setItem(STORAGE_USERS_LIST,JSON.stringify(l));}
function renderBar(){const u=getLoginUser();const a=document.getElementById('abar');if(u){a.innerHTML=`<a class="u-avatar" style="background:${u.color||'#448aff'}" href="profile.html?name=${encodeURIComponent(u.name)}">${u.name[0]}</a><span class="u-name">${u.name}</span>${u.type==='creator'?'<span style="font-size:10px;background:#fee;color:red;padding:1px 5px;border-radius:6px">创作者</span>':''}<button class="btn-out" onclick="doLogout()">退出</button>`}else{a.innerHTML=`<button onclick="openPop()" style="padding:6px 14px;border:1px solid #448aff;background:transparent;color:#448aff;border-radius:14px;cursor:pointer">登录</button> <button onclick="openPop();swTab('reg')" style="padding:6px 14px;border:none;background:#448aff;color:#fff;border-radius:14px;cursor:pointer">注册</button>`}}
function openPop(){document.getElementById('pop').classList.add('show');swTab('login');}
function closePop(){document.getElementById('pop').classList.remove('show');}
function swTab(t){const tabs=document.querySelectorAll('.tabs .tab');tabs.forEach(x=>x.classList.remove('on'));if(t==='login'){tabs[0].classList.add('on');document.getElementById('pg-login').style.display='block';document.getElementById('pg-reg').style.display='none';}else{tabs[1].classList.add('on');document.getElementById('pg-reg').style.display='block';document.getElementById('pg-login').style.display='none';}}
async function doLogin(){const n=document.getElementById('l-user').value.trim(),p=document.getElementById('l-pw').value,e=document.getElementById('e-login');e.textContent='';if(!n||!p){e.textContent='请填写账号密码';return;}try{const r=await fetch('./'+encodeURIComponent(n)+'/密码.txt',{cache:'no-store'});if(r.ok){const txt=(await r.text()).trim();if(txt===p){saveLoginUser({name:n,color:'#cc0000',type:'creator'});closePop();showToast('登录成功！');return;}}else{e.textContent='密码错误';return;}}catch(e2){}const all=getUsers();const f=all.find(x=>(x.mail===n||x.name===n)&&x.pw===p);if(f){saveLoginUser({name:f.name,color:f.color||'#448aff',type:'user'});closePop();showToast('登录成功！');}else e.textContent='账号不存在或密码错误';}
let _vc='',_ve=0,_rn='',_rp='';
function doSend(){const m=document.getElementById('r-mail').value.trim(),n=document.getElementById('r-name').value.trim(),ph=document.getElementById('r-phone').value.trim(),pw=document.getElementById('r-pw').value,e=document.getElementById('e-reg');e.textContent='';if(!m||!n||!pw){e.textContent='请填写完整';return;}if(pw.length<6){e.textContent='密码至少6位';return;}if(ph&&!/^1[3-9]\d{9}$/.test(ph)){e.textContent='手机号格式不对';return;}const all=getUsers();if(all.some(x=>x.mail===m)){e.textContent='邮箱已注册';return;}_vc=String(Math.floor(100000+Math.random()*900000));_ve=Date.now()+300000;_rn=n;_rp=pw;document.getElementById('v-tip').style.display='block';document.getElementById('v-tip').textContent='验证码：'+_vc;document.getElementById('r-code').style.display='block';document.getElementById('r-go').style.display='block';}
function doReg(){const c=document.getElementById('r-code').value.trim(),e=document.getElementById('e-reg');if(!_vc)return;if(Date.now()>_ve){e.textContent='过期';return;}if(c!==_vc){e.textContent='错误';return;}const colors=['#065fd4','#137333','#e37400','#8e24aa','#0097a7','#cc0000'];const co=colors[Math.floor(Math.random()*colors.length)];const all=getUsers();all.push({mail:document.getElementById('r-mail').value.trim(),name:_rn,phone:document.getElementById('r-phone').value.trim(),pw:_rp,color:co});saveUsers(all);saveLoginUser({name:_rn,color:co,type:'user'});closePop();showToast('注册成功！');}
function doLogout(){saveLoginUser(null);}

const urlParams=new URLSearchParams(location.search);
let targetUser=urlParams.get("name");
if(!targetUser){const cur=getLoginUser();targetUser=cur?cur.name:"访客";}
document.getElementById("showName").innerText=targetUser;

function shareChannel(){const u=location.origin+location.pathname+"?name="+encodeURIComponent(targetUser);if(navigator.share){navigator.share({title:targetUser+" 的频道",url:u});}else{navigator.clipboard.writeText(u);showToast("频道链接已复制！");}}

let videos=JSON.parse(localStorage.getItem(STORAGE_VIDEOS)||"[]");
let html="";
const userVideos=videos.filter(v=>v.author===targetUser);
if(userVideos.length===0){html="<p style='color:#aaa'>该用户暂时没有发布任何视频</p>";}
else{userVideos.forEach(v=>{html+=`<div class="video-card" onclick="location.href='${v.page}'"><div class="thumb"></div><div class="info"><h4>${v.title}</h4><p>${v.author}</p></div></div>`;});}
document.getElementById("videoList").innerHTML=html;

renderBar();
document.getElementById('pop').addEventListener('click',e=>{if(e.target===document.getElementById('pop'))closePop();});
</script>
</body>
</html>
