<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 | Project Pioneer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#0f0f0f;color:#fff;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#181818;position:sticky;top:0;z-index:99;gap:12px;flex-wrap:wrap;}
.logo{font-size:22px;font-weight:bold;color:#fff;text-decoration:none}
.nav a{color:#ddd;text-decoration:none;margin:0 10px;padding:6px 10px;border-radius:6px}
.nav a:hover{background:#272727}
.search-input{padding:8px 12px;border:none;border-radius:4px;width:260px;background:#121212;color:#fff;border:1px solid #333}
.login-btn{padding:8px 16px;border-radius:20px;border:1px solid #448aff;background:transparent;color:#448aff;cursor:pointer}
.container{max-width:960px;margin:30px auto;padding:0 20px}
.user-card{background:#181818;border-radius:12px;padding:24px;margin-bottom:24px}
.username{font-size:26px;font-weight:bold;margin-bottom:8px}
.desc{color:#aaa;margin-bottom:16px}
.btn-share{padding:8px 16px;background:#448aff;border:none;color:#fff;border-radius:6px;cursor:pointer}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.video-card{background:#181818;border-radius:10px;overflow:hidden;cursor:pointer}
.video-card .thumb{height:146px;background:#222}
.video-card .info{padding:12px}
.video-card h4{margin-bottom:4px}
.video-card p{color:#aaa;font-size:13px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1000}
.modal-box{background:#181818;padding:26px;border-radius:10px;width:min(360px,90%)}
.modal-box h3{margin-bottom:14px;}
.modal-box input{width:100%;padding:10px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:6px}
.btn-group{display:flex;gap:10px;margin-top:12px}
button{padding:9px;border-radius:6px;border:none;cursor:pointer}
.primary{background:#448aff;color:white}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">Project Pioneer</a>
<div class="nav">
<a href="index.html">首页</a>
<a href="upload.html">上传视频</a>
<a href="about.html">关于我们</a>
</div>
<div>
<input class="search-input" placeholder="搜索视频...">
<button class="login-btn" onclick="openLogin()">登录 / 注册</button>
</div>
</header>

<div class="container">
<div class="user-card">
<div class="username" id="showName">加载中...</div>
<div class="desc" id="showDesc">暂无简介</div>
<button class="btn-share" onclick="shareChannel()">分享此频道</button>
</div>
<h3 style="margin-bottom:16px;">作品列表</h3>
<div class="video-grid" id="videoList"></div>
</div>

<div class="modal" id="loginModal">
<div class="modal-box">
<h3>账号登录</h3>
<input id="username" placeholder="用户名">
<input id="pwd" type="password" placeholder="密码">
<div class="btn-group">
<button class="primary" onclick="login()">登录</button>
<button onclick="register()">注册账号</button>
<button onclick="closeLogin()">关闭</button>
</div>
</div>
</div>

<script>
function openLogin(){document.getElementById("loginModal").style.display="flex";}
function closeLogin(){document.getElementById("loginModal").style.display="none";}
function login(){
const name=document.getElementById("username").value.trim();
const pw=document.getElementById("pwd").value.trim();
const userList=JSON.parse(localStorage.getItem("users")||"[]");
const find=userList.find(u=>u.name===name&&u.pwd===pw);
if(find){
localStorage.setItem("nowUser",JSON.stringify(find));
alert("登录成功！");
closeLogin();
location.reload();
}else{
alert("用户名或密码错误");
}
}
function register(){
const name=document.getElementById("username").value.trim();
const pw=document.getElementById("pwd").value.trim();
if(!name||!pw){alert("用户名密码不能为空");return;}
let users=JSON.parse(localStorage.getItem("users")||"[]");
if(users.find(x=>x.name===name)){alert("用户名已存在");return;}
users.push({name,pw});
localStorage.setItem("users",JSON.stringify(users));
alert("注册完成，请登录");
}

const urlParams=new URLSearchParams(location.search);
let targetUser=urlParams.get("name");
if(!targetUser){
const currentLogin=JSON.parse(localStorage.getItem("nowUser")||"{}");
targetUser=currentLogin.name||"访客";
}
document.getElementById("showName").innerText=targetUser;

function shareChannel(){
const shareUrl=location.origin+location.pathname+"?name="+encodeURIComponent(targetUser);
if(navigator.share){
navigator.share({
title:targetUser+" 的频道 | Project Pioneer",
url:shareUrl
});
}else{
navigator.clipboard.writeText(shareUrl);
alert("频道链接已复制到剪贴板！");
}
}

let videos=JSON.parse(localStorage.getItem("videos")||"[]");
let html="";
const userVideos=videos.filter(v=>v.author===targetUser);
if(userVideos.length===0){
html="<p>该用户暂时没有发布任何视频</p>";
}else{
userVideos.forEach(v=>{
html+=`
<div class="video-card" onclick="location.href='${v.page}'">
<div class="thumb"></div>
<div class="info">
<h4>${v.title}</h4>
<p>${v.author}</p>
</div>
</div>`;
});
}
document.getElementById("videoList").innerHTML=html;
</script>
</body>
</html>
