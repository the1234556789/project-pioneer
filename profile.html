<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 - project-pioneer</title>
<style>
  :root { --google-blue:#1a73e8; --text-main:#202124; --text-sub:#5f6368; --border-color:#dadce0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Roboto',Arial,sans-serif; background:#f6f9fc; color:var(--text-main); padding-bottom:80px; }

  .topbar { background:#fff; border-bottom:1px solid var(--border-color); padding:10px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .topbar .brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:500; }
  .topbar .brand img { width:32px; height:32px; border-radius:50%; object-fit:cover; }

  .abtn { display:flex; align-items:center; gap:8px; text-decoration:none; font-size:14px; margin-right:12px; }
  .user-chip { width:32px; height:32px; border-radius:50%; background:var(--google-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; }
  .user-name { color:var(--text-sub); }
  .btn-login-nav { background:var(--google-blue); color:#fff; border:none; padding:8px 20px; border-radius:16px; font-size:14px; cursor:pointer; margin-right:8px; font-family:inherit; }
  .btn-reg-nav { background:#fff; color:var(--google-blue); border:1px solid var(--google-blue); padding:8px 20px; border-radius:16px; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn-logout { background:none; border:1px solid var(--border-color); color:var(--text-sub); padding:6px 14px; border-radius:14px; font-size:14px; cursor:pointer; font-family:inherit; }

  .container { max-width:900px; margin:0 auto; padding:24px; }
  .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:32px; }
  .avatar-big { width:72px; height:72px; border-radius:50%; background:var(--google-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:500; }
  .profile-name { font-size:22px; font-weight:500; }
  .profile-email { font-size:14px; color:var(--text-sub); }

  .section-title { font-size:18px; font-weight:500; margin-bottom:16px; }
  .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
  .video-card { background:#fff; border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:box-shadow 0.2s; }
  .video-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.12); }
  .thumb { width:100%; aspect-ratio:16/9; background:#e0e0e0; display:flex; align-items:center; justify-content:center; font-size:32px; color:#9e9e9e; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .video-info { padding:12px; }
  .video-title { font-size:14px; font-weight:500; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4; }
  .video-stats { font-size:12px; color:var(--text-sub); }

  .empty { text-align:center; padding:60px 20px; color:var(--text-sub); }
  .empty .icon { font-size:48px; margin-bottom:12px; }

  /* 上传按钮 */
  .upload-fab { position:fixed; right:24px; bottom:56px; background:var(--google-blue); color:#fff; border:none; padding:14px 24px; border-radius:24px; font-size:14px; font-weight:500; cursor:pointer; box-shadow:0 4px 12px rgba(26,115,232,0.4); z-index:150; display:none; }
  .upload-fab:hover { background:#1557b0; }

  /* 版权 */
  .copyright { position:fixed; right:16px; bottom:16px; font-size:12px; color:var(--text-sub); background:rgba(255,255,255,0.9); padding:6px 12px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.08); z-index:200; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="https://the1234556789.github.io/project-pioneer/login/project-pioneer.jpg" alt="project-pioneer">
    <span>project-pioneer</span>
  </div>
  <div id="abar"></div>
</div>

<div class="container">
  <div class="profile-header">
    <div class="avatar-big" id="avatarBig">U</div>
    <div>
      <div class="profile-name" id="profileName">加载中...</div>
      <div class="profile-email" id="profileEmail"></div>
    </div>
  </div>

  <div class="section-title">我的视频</div>
  <div class="video-grid" id="myVideos"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="icon">📭</div>
    <div id="emptyText">还没有发布过视频</div>
    <a href="https://the1234556789.github.io/project-pioneer/upload.html" style="color:#1a73e8">去发布 →</a>
  </div>
</div>

<button class="upload-fab" id="uploadFab" onclick="location.href='https://the1234556789.github.io/project-pioneer/upload.html'">＋ 上传视频</button>
<div class="copyright">©2024-2026 会泽工作室 版权所有</div>

<script src="https://the1234556789.github.io/project-pioneer/auth.js"></script>
<script>
AUTH.renderBar();

var u=AUTH.getUser();
if(u){
  document.getElementById('profileName').textContent=u.username||u.email||'用户';
  document.getElementById('profileEmail').textContent=u.email||'';
  document.getElementById('avatarBig').textContent=(u.username||u.email||'U').charAt(0).toUpperCase();
  loadMyVideos();
}else{
  document.getElementById('profileName').textContent='未登录';
  document.getElementById('emptyState').style.display='block';
  document.getElementById('emptyText').textContent='请先登录查看个人主页';
}

function loadMyVideos(){
  var videos=JSON.parse(localStorage.getItem('pp_videos')||'[]');
  var myVids=videos.filter(function(v){return v.author===AUTH.getUser().username||v.author===AUTH.getUser().email;});
  var grid=document.getElementById('myVideos');
  grid.innerHTML='';
  if(myVids.length===0){document.getElementById('emptyState').style.display='block';return;}
  document.getElementById('emptyState').style.display='none';
  myVids.forEach(function(v){
    var card=document.createElement('div');
    card.className='video-card';
    card.onclick=function(){location.href=v.url||'#';};
    card.innerHTML='<div class="thumb">'+(v.thumb?'<img src="'+v.thumb+'">':'▶️')+'</div><div class="video-info"><div class="video-title">'+v.title+'</div><div class="video-stats">'+(v.views||0)+' 次观看</div></div>';
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
