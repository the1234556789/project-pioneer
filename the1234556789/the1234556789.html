<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the1234556789 | Project Pioneer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
body { background: #0f0f0f; color: #fff; padding-bottom: 80px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #181818; position: sticky; top: 0; z-index: 99; gap: 12px; flex-wrap: wrap; }
.logo { font-size: 22px; font-weight: bold; color: #fff; text-decoration: none; cursor: pointer; }
.logo span { color: #ff4444; }
.nav { display: flex; gap: 4px; }
.nav a { color: #ddd; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14px; }
.nav a:hover { background: #272727; }
.search-area { display: flex; align-items: center; gap: 8px; }
.search-input { padding: 9px 14px; border: none; border-radius: 20px 0 0 20px; width: 220px; background: #121212; color: #fff; border: 1px solid #333; outline: none; font-size: 14px; }
.search-input:focus { border-color: #448aff; }
.search-btn { background: #272727; color: #fff; border: none; padding: 9px 14px; border-radius: 0 20px 20px 0; cursor: pointer; font-size: 14px; }
.search-btn:hover { background: #448aff; }

.container { max-width: 1240px; margin: 30px auto; padding: 0 20px; }

.channel-box { background: #181818; border-radius: 12px; padding: 24px; margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
.channel-avatar { width: 80px; height: 80px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; flex-shrink: 0; }
.channel-info h1 { margin-bottom: 4px; font-size: 22px; }
.channel-info p { color: #aaa; font-size: 14px; margin-bottom: 10px; }
.share-btn { padding: 8px 16px; border-radius: 20px; border: none; background: #272727; color: white; cursor: pointer; font-size: 13px; }
.share-btn:hover { background: #448aff; }

.section-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: #ddd; }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.video-card { background: #181818; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
.video-card:hover { transform: translateY(-2px); }
.thumb { height: 146px; background: #222; display: flex; align-items: center; justify-content: center; }
.thumb iframe { width: 100%; height: 100%; border: none; }
.info { padding: 12px; }
.info h4 { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.info p { font-size: 12px; color: #888; }

.empty { text-align: center; padding: 40px; color: #666; font-size: 14px; }

/* Toast */
.toast { position: fixed; top: 70px; right: 24px; background: #323232; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 300; opacity: 0; transform: translateY(-10px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* 上传按钮 */
.upload-fab { position: fixed; right: 24px; bottom: 56px; background: #448aff; color: #fff; border: none; padding: 14px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 12px rgba(68,138,255,0.4); z-index: 150; display: none; }
.upload-fab:hover { background: #3367d6; }

/* 版权 */
.copyright { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #aaa; background: rgba(24,24,24,0.95); padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 200; }

@media (max-width: 768px) {
  header { flex-direction: column; align-items: stretch; }
  .search-area { width: 100%; }
  .search-input { flex: 1; width: auto; }
  .channel-box { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <a class="logo" onclick="location.href='index.html'">Project<span>Pioneer</span></a>
  <div class="nav">
    <a href="index.html">首页</a>
    <a href="upload.html">上传视频</a>
  </div>
  <div class="search-area">
    <input class="search-input" id="searchText" placeholder="搜索视频...">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <div class="user-area" id="abar"></div>
</header>

<div class="container">
  <div class="channel-box">
    <div class="channel-avatar" id="chAvatar">the</div>
    <div class="channel-info">
      <h1 id="chName">the1234556789</h1>
      <p id="chSub">创作者频道 · 纯前端视频平台</p>
      <button class="share-btn" onclick="shareChannel()">分享频道</button>
    </div>
  </div>

  <div class="section-title">发布的视频</div>
  <div class="video-grid" id="videoGrid"></div>
</div>

<button class="upload-fab" id="uploadFab" onclick="location.href='upload.html'">＋ 上传视频</button>
<div class="copyright">©2024-2026 会泽工作室 版权所有</div>

<script src="https://the1234556789.github.io/project-pioneer/auth.js"></script>
<script>
const STORAGE_VIDEOS = "pp_videos";

function gid(id){ return document.getElementById(id); }
function safeStr(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showToast(msg){
  const t = gid('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function initDefaultVideo(){
  let videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");

  // 升级旧数据
  videos.forEach(v => {
    if (v.page === "dQw4w9WgXcQ.html") {
      v.title = "自制短片 - 项目完整演示";
      v.desc = "开发mc启动器";
      delete v.author;
      v.up = "the1234556789";
    }
  });

  // 写入默认视频（如果不存在）
  if (!videos.find(v => v.page === "dQw4w9WgXcQ.html")) {
    videos.push({
      title: "自制短片 - 项目完整演示",
      desc: "开发mc启动器",
      page: "dQw4w9WgXcQ.html",
      type: "local",
      category: "tech",
      up: "the1234556789",
      plays: "1000.9万次播放",
      date: "2026-07-31"
    });
  }

  localStorage.setItem(STORAGE_VIDEOS, JSON.stringify(videos));
}

function doSearch(){
  const key = gid('searchText').value.trim();
  if(key) location.href = `index.html?q=${encodeURIComponent(key)}`;
  else location.href = 'index.html';
}

function shareChannel(){
  const shareUrl = window.location.href;
  if(navigator.share){
    navigator.share({title: "the1234556789 频道 | Project Pioneer", url: shareUrl});
  } else {
    navigator.clipboard.writeText(shareUrl).then(() => showToast('链接已复制！'));
  }
}

function renderVideo(){
  const videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");
  const myVideos = videos.filter(v => v.up === "the1234556789" || v.author === "the1234556789");
  const grid = gid('videoGrid');

  if(myVideos.length === 0){
    grid.innerHTML = '<div class="empty">该作者暂无视频</div>';
    return;
  }

  let html = '';
  myVideos.forEach(v => {
    const isBili = v.type === 'bilibili' && v.bvid;
    html += `<div class="video-card" onclick="location.href='watch.html?page=${v.page}'">
      <div class="thumb">${isBili ? `<iframe src="https://player.bilibili.com/player.html?bvid=${v.bvid}&page=1&autoplay=0&danmaku=0&as_wide=1&high_quality=0" scrolling="no" frameborder="0" allowfullscreen></iframe>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px;">本地视频</div>`}</div>
      <div class="info">
        <h4>${safeStr(v.title)}</h4>
        <p>${safeStr(v.up || v.author || 'the1234556789')}</p>
      </div>
    </div>`;
  });
  grid.innerHTML = html;
}

function initPage(){
  initDefaultVideo();

  // 频道头像和名字
  const chName = "the1234556789";
  gid('chName').textContent = chName;
  gid('chAvatar').textContent = chName.substring(0, 2);
  gid('chSub').textContent = '创作者频道 · 纯前端视频平台';

  // 从用户列表取颜色
  const allUsers = AUTH._getUsers ? AUTH._getUsers() : [];
  const me = allUsers.find(x => x.name === chName);
  if(me) gid('chAvatar').style.background = me.color;

  // 统一登录栏
  AUTH.renderBar();

  // 已登录显示上传按钮
  if (AUTH.getUser()){ gid('uploadFab').style.display = 'block'; }

  renderVideo();

  // URL 参数搜索回填
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if(q) gid('searchText').value = q;
}

initPage();
</script>
</body>
</html>
