<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the1234556789 - Project Pioneer</title>
<style>
* { margin:0; padding:0; box-sizing: border-box; }
body { font-family: Roboto, Arial, "PingFang SC", sans-serif; background: #0f0f0f; color: #f1f1f1; }

/* 顶栏 */
header {
  position: sticky; top: 0; z-index: 10;
  height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px;
  background: #0f0f0f; border-bottom: 1px solid #222;
}
.left, .right { display: flex; align-items: center; gap: 16px; }
.logo { color: #ff0000; font-size: 20px; font-weight: 700; letter-spacing: -1px; text-decoration: none; }
.back { color: #aaa; text-decoration: none; font-size: 14px; }
.back:hover { color: #fff; }

/* 频道头部 */
.banner {
  width: 100%; height: 180px;
  background: linear-gradient(135deg, #cc0000, #660000);
  position: relative;
}
.channel-header {
  max-width: 1100px; margin: 0 auto; padding: 0 24px;
  position: relative; margin-top: -48px; margin-bottom: 24px;
}
.channel-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: #cc0000; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 700;
  border: 4px solid #0f0f0f; margin-bottom: 12px;
}
.channel-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.channel-handle { font-size: 14px; color: #aaa; margin-bottom: 12px; }
.channel-desc { font-size: 14px; line-height: 1.6; color: #ccc; max-width: 600px; margin-bottom: 12px; }
.channel-stats { font-size: 13px; color: #aaa; margin-bottom: 16px; }
.channel-actions { display: flex; gap: 12px; margin-bottom: 24px; }
.btn-sub {
  padding: 10px 20px; background: #fff; color: #0f0f0f;
  border: none; border-radius: 18px; font-weight: 500; cursor: pointer; font-size: 14px;
}
.btn-sub:hover { background: #ddd; }
.btn-share {
  padding: 10px 20px; background: #272727; color: #fff;
  border: none; border-radius: 18px; cursor: pointer; font-size: 14px;
}
.btn-share:hover { background: #333; }

/* 导航标签 */
.channel-tabs {
  display: flex; gap: 0; border-bottom: 1px solid #222;
  max-width: 1100px; margin: 0 auto; padding: 0 24px;
}
.channel-tab {
  padding: 12px 24px; cursor: pointer; font-size: 14px; color: #aaa;
  border-bottom: 2px solid transparent;
}
.channel-tab.active { color: #fff; border-bottom-color: #ff0000; font-weight: 500; }
.channel-tab:hover { color: #fff; }

/* 内容区 */
.content {
  max-width: 1100px; margin: 0 auto; padding: 24px;
}
.section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }

/* 影片网格 */
.video-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.video-card {
  cursor: pointer; text-decoration: none; color: inherit;
}
.video-card .thumb {
  aspect-ratio: 16/9; border-radius: 12px;
  background: linear-gradient(135deg, #303030, #1a1a1a);
  position: relative; margin-bottom: 10px;
}
.video-card .dur {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(0,0,0,.85); font-size: 12px; padding: 2px 6px; border-radius: 4px;
}
.video-card h4 { font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
.video-card p { font-size: 12px; color: #aaa; }

/* 评论区 */
.comment-item {
  display: flex; gap: 12px; margin-bottom: 16px;
  padding-bottom: 16px; border-bottom: 1px solid #222;
}
.comment-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; flex-shrink: 0;
}
.comment-body { flex: 1; }
.comment-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.comment-author { font-size: 13px; font-weight: 600; }
.comment-time { font-size: 11px; color: #aaa; }
.comment-text { font-size: 14px; line-height: 1.5; color: #ddd; }

/* 关于页 */
.about-section { display: none; }
.about-section.on { display: block; }
.about-card {
  background: #1a1a1a; border-radius: 12px; padding: 20px;
  margin-bottom: 16px; border: 1px solid #333;
}
.about-card h3 { font-size: 16px; margin-bottom: 12px; }
.about-card p { font-size: 14px; color: #ccc; line-height: 1.6; }

/* 返回主页 */
.home-link {
  display: inline-block; margin-top: 24px; color: #3ea6ff;
  text-decoration: none; font-size: 14px;
}
.home-link:hover { text-decoration: underline; }

@media (max-width: 768px) {
  .banner { height: 120px; }
  .channel-avatar { width: 72px; height: 72px; font-size: 28px; }
  .channel-name { font-size: 18px; }
}
</style>
</head>
<body>

<!-- 顶栏 -->
<header>
  <div class="left">
    <a href="../index.html" class="back">← 返回</a>
    <a href="../index.html" class="logo">▶ Project Pioneer</a>
  </div>
  <div class="right">
    <a href="../dQw4w9WgXcQ.html" style="color:#3ea6ff;text-decoration:none;font-size:14px;">观看视频</a>
  </div>
</header>

<!-- 频道横幅 -->
<div class="banner"></div>

<!-- 频道信息 -->
<div class="channel-header">
  <div class="channel-avatar">the</div>
  <div class="channel-name">the1234556789</div>
  <div class="channel-handle">@the1234556789</div>
  <div class="channel-desc">开发mc启动器</div>
  <div class="channel-stats">1 个视频 · 1000.9万次观看</div>
  <div class="channel-actions">
    <button class="btn-sub">订阅</button>
    <button class="btn-share">分享频道</button>
  </div>
</div>

<!-- 标签 -->
<div class="channel-tabs">
  <div class="channel-tab active" onclick="swTab('videos')">影片</div>
  <div class="channel-tab" onclick="swTab('comments')">评论</div>
  <div class="channel-tab" onclick="swTab('about')">关于</div>
</div>

<!-- 内容区 -->
<div class="content">

  <!-- 影片 -->
  <div id="tab-videos">
    <div class="section-title">上传的视频</div>
    <div class="video-grid">
      <a class="video-card" href="../dQw4w9WgXcQ.html">
        <div class="thumb"><span class="dur">04:22</span></div>
        <h4>自制短片 - 项目完整演示</h4>
        <p>1000.9万次观看 · 今天</p>
      </a>
    </div>
  </div>

  <!-- 评论 -->
  <div id="tab-comments" style="display:none">
    <div class="section-title">公开评论</div>
    <div id="my-comments"></div>
  </div>

  <!-- 关于 -->
  <div id="tab-about" class="about-section">
    <div class="about-card">
      <h3>简介</h3>
      <p>开发mc启动器<br><br>创作者加入时间：2026年7月</p>
    </div>
    <div class="about-card">
      <h3>统计信息</h3>
      <p>1 个视频<br>1000.9万次总观看<br>12 条评论获赞</p>
    </div>
  </div>

  <a href="../mc.html" class="home-link">← 返回首页</a>
</div>

<script>
// ===== 标签切换 =====
function swTab(t){
  document.querySelectorAll('.channel-tab')[0].className = 'channel-tab' + (t==='videos'?' active':'');
  document.querySelectorAll('.channel-tab')[1].className = 'channel-tab' + (t==='comments'?' active':'');
  document.querySelectorAll('.channel-tab')[2].className = 'channel-tab' + (t==='about'?' active':'');

  $('tab-videos').style.display = t==='videos' ? 'block' : 'none';
  $('tab-comments').style.display = t==='comments' ? 'block' : 'none';
  $('tab-about').className = 'about-section' + (t==='about' ? ' on' : '');

  if(t==='comments') loadMyComments();
}

function $(id){return document.getElementById(id);}

// ===== 加载我的评论 =====
function timeAgo(ts){
  var d=Date.now()-ts,m=60000,h=3600000,D=86400000;
  if(d<m)return'刚刚';if(d<h)return Math.floor(d/m)+'分钟前';
  if(d<D)return Math.floor(d/h)+'小时前';if(d<D*30)return Math.floor(d/D)+'天前';
  var x=new Date(ts);return x.getFullYear()+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日';
}

function safe(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function loadMyComments(){
  var all = JSON.parse(localStorage.getItem('pp_cm') || '[]');
  var my = [];
  for(var i=0;i<all.length;i++){
    var c = all[i];
    if(c.author === 'the1234556789') my.push(c);
    if(c.replies) for(var j=0;j<c.replies.length;j++){
      if(c.replies[j].author === 'the1234556789') my.push(c.replies[j]);
    }
  }
  if(my.length === 0){
    $('my-comments').innerHTML = '<p style="color:#aaa;font-size:14px">暂无公开评论</p>';
    return;
  }
  var html = '';
  for(var i=0;i<my.length;i++){
    var c = my[i];
    html += '<div class="comment-item"><div class="comment-avatar" style="background:'+c.color+'">'+c.author[0]+'</div><div class="comment-body"><div class="comment-meta"><span class="comment-author">'+safe(c.author)+'</span><span class="comment-time">'+timeAgo(c.time)+'</span></div><div class="comment-text">'+safe(c.text)+'</div></div></div>';
  }
  $('my-comments').innerHTML = html;
}
</script>
</body>
</html>
