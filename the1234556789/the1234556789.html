<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the1234556789 | Project Pioneer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
body { background: #0f0f0f; color: #fff; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #181818; position: sticky; top: 0; z-index: 99; gap: 12px; flex-wrap: wrap; }
.logo { font-size: 22px; font-weight: bold; color: #fff; text-decoration: none; }
.logo span { color: #ff4444; }
.nav a { color: #ddd; text-decoration: none; margin: 0 10px; padding: 6px 10px; border-radius: 6px; font-size: 14px; }
.nav a:hover { background: #272727; }
.search-area { display: flex; align-items: center; gap: 8px; }
.search-input { padding: 9px 14px; border: none; border-radius: 20px 0 0 20px; width: 220px; background: #121212; color: #fff; border: 1px solid #333; outline: none; font-size: 14px; }
.search-input:focus { border-color: #448aff; }
.search-btn { background: #272727; color: #fff; border: none; padding: 9px 14px; border-radius: 0 20px 20px 0; cursor: pointer; font-size: 14px; }
.search-btn:hover { background: #448aff; }
.user-area { display: flex; align-items: center; gap: 10px; }
.u-avatar { width: 32px; height: 32px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
.u-name { font-size: 14px; cursor: pointer; color: #ddd; }
.u-name:hover { color: #fff; }
.u-badge { font-size: 10px; background: #fee; color: #c00; padding: 2px 6px; border-radius: 8px; }
.btn-out { padding: 6px 14px; border: 1px solid #666; background: transparent; color: #ccc; border-radius: 16px; cursor: pointer; font-size: 12px; }
.btn-out:hover { border-color: #ccc; color: #fff; }

.container { max-width: 1240px; margin: 30px auto; padding: 0 20px; }

.channel-box { background: #181818; border-radius: 12px; padding: 24px; margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
.channel-avatar { width: 80px; height: 80px; border-radius: 50%; background: #448aff; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; flex-shrink: 0; }
.channel-info h1 { margin-bottom: 4px; font-size: 22px; }
.channel-info p { color: #aaa; font-size: 14px; margin-bottom: 10px; }
.share-btn { padding: 8px 16px; border-radius: 20px; border: none; background: #272727; color: white; cursor: pointer; font-size: 13px; }
.share-btn:hover { background: #448aff; }

.section-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: #ddd; }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.video-card { background: #181818; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
.video-card:hover { transform: translateY(-2px); }
.thumb { height: 146px; background: #222; display: flex; align-items: center; justify-content: center; }
.thumb iframe { width: 100%; height: 100%; border: none; }
.info { padding: 12px; }
.info h4 { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.info p { font-size: 12px; color: #888; }

/* 遮罩弹窗 */
.cover { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
.cover.show { display: flex; }
.popup { background: #222; border-radius: 12px; padding: 24px; width: 360px; }
.popup h2 { margin: 0 0 16px 0; font-size: 18px; color: #fff; }
.tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid #333; }
.tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; font-size: 14px; }
.tab.on { color: #448aff; border-bottom-color: #448aff; font-weight: bold; }
.page { display: none; }
.page.on { display: block; }
.popup input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #444; border-radius: 8px; background: #111; color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
.popup input:focus { border-color: #448aff; }
.popup button.go { width: 100%; padding: 10px; background: #448aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.popup button.go:hover { background: #3367d6; }
.err { color: #ff6666; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
.tip { font-size: 12px; color: #448aff; background: #1a2332; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }

/* Toast */
.toast { position: fixed; top: 70px; right: 24px; background: #323232; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 300; opacity: 0; transform: translateY(-10px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

.empty { text-align: center; padding: 40px; color: #666; font-size: 14px; }

@media (max-width: 768px) {
  header { flex-direction: column; align-items: stretch; }
  .search-area { width: 100%; }
  .search-input { flex: 1; width: auto; }
  .channel-box { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- 登录/注册弹窗 -->
<div class="cover" id="pop">
  <div class="popup">
    <h2>登录</h2>
    <div class="tabs">
      <div class="tab on" onclick="swTab('login')">登录</div>
      <div class="tab" onclick="swTab('reg')">注册</div>
    </div>
    <div class="page on" id="pg-login">
      <div class="err" id="e-login"></div>
      <input id="l-user" placeholder="用户名 / 邮箱">
      <input id="l-pw" type="password" placeholder="密码">
      <button class="go" onclick="doLogin()">登录</button>
    </div>
    <div class="page" id="pg-reg">
      <div class="err" id="e-reg"></div>
      <input id="r-mail" placeholder="邮箱">
      <input id="r-name" placeholder="昵称">
      <input id="r-phone" placeholder="手机号（可选）">
      <input id="r-pw" type="password" placeholder="密码（至少6位）">
      <button class="go" onclick="doSend()">发送验证码</button>
      <div class="tip" id="v-tip" style="display:none"></div>
      <input id="r-code" placeholder="6位验证码" style="display:none">
      <button class="go" id="r-go" onclick="doReg()" style="display:none">完成注册</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<header>
  <a class="logo" href="../index.html">Project<span>Pioneer</span></a>
  <div class="nav">
    <a href="../index.html">首页</a>
    <a href="../upload.html">上传视频</a>
  </div>
  <div class="search-area">
    <input class="search-input" id="searchText" placeholder="搜索视频...">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <div class="user-area" id="abar"></div>
</header>

<div class="container">
  <div class="channel-box">
    <div class="channel-avatar" id="chAvatar">the</div>
    <div class="channel-info">
      <h1 id="chName">the1234556789</h1>
      <p id="chSub">创作者频道</p>
      <button class="share-btn" onclick="shareChannel()">分享频道</button>
    </div>
  </div>

  <div class="section-title">发布的视频</div>
  <div class="video-grid" id="videoGrid"></div>
</div>

<script>
const STORAGE_USER_KEY = "pp_user";
const STORAGE_USERS_LIST = "pp_users";
const STORAGE_VIDEOS = "pp_videos";

function gid(id){ return document.getElementById(id); }
function safeStr(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showToast(msg){
  const t = gid('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function initDefaultVideo(){
  let videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");

  // 升级旧数据
  videos.forEach(v => {
    if (v.page === "dQw4w9WgXcQ.html") {
      v.title = "自制短片 - 项目完整演示";
      v.desc = "开发mc启动器";
      delete v.author;
      v.up = "the1234556789";
    }
  });

  // 写入默认视频（如果不存在）
  if (!videos.find(v => v.page === "dQw4w9WgXcQ.html")) {
    videos.push({
      title: "自制短片 - 项目完整演示",
      desc: "开发mc启动器",
      page: "dQw4w9WgXcQ.html",
      type: "local",
      category: "all",
      up: "the1234556789"
    });
  }

  localStorage.setItem(STORAGE_VIDEOS, JSON.stringify(videos));
}

function getLoginUser(){ const raw = localStorage.getItem(STORAGE_USER_KEY); return raw ? JSON.parse(raw) : null; }
function saveLoginUser(u){ if(u) localStorage.setItem(STORAGE_USER_KEY, JSON.stringify(u)); else localStorage.removeItem(STORAGE_USER_KEY); renderBar(); }
function getUsers(){ const raw = localStorage.getItem(STORAGE_USERS_LIST); return raw ? JSON.parse(raw) : []; }
function saveUsers(list){ localStorage.setItem(STORAGE_USERS_LIST, JSON.stringify(list)); }

function renderBar(){
  const u = getLoginUser(); const abar = gid('abar');
  if(u){
    abar.innerHTML = `<a class="u-avatar" style="background:${u.color}" onclick="location.href='../profile.html?name=${encodeURIComponent(u.name)}'">${u.name[0]}</a><span class="u-name" onclick="location.href='../profile.html?name=${encodeURIComponent(u.name)}'">${safeStr(u.name)}</span>${u.type==='creator'?'<span class="u-badge">创作者</span>':''}<button class="btn-out" onclick="doLogout()">退出</button>`;
  } else {
    abar.innerHTML = `<button class="login-btn" onclick="openPop()">登录 / 注册</button>`;
  }
}

function openPop(){ gid('pop').classList.add('show'); swTab('login'); }
function closePop(){ gid('pop').classList.remove('show'); }
function swTab(t){
  const tabs = document.querySelectorAll('.tabs .tab'); tabs.forEach(tab => tab.classList.remove('on'));
  if(t === 'login'){ tabs[0].classList.add('on'); gid('pg-login').style.display = 'block'; gid('pg-reg').style.display = 'none'; gid('e-login').textContent = ''; }
  else{ tabs[1].classList.add('on'); gid('pg-reg').style.display = 'block'; gid('pg-login').style.display = 'none'; gid('e-reg').textContent = ''; }
  gid('l-user').value = ''; gid('l-pw').value = ''; gid('r-mail').value = ''; gid('r-name').value = ''; gid('r-phone').value = ''; gid('r-pw').value = ''; gid('r-code').value = ''; gid('v-tip').style.display = 'none'; gid('r-code').style.display = 'none'; gid('r-go').style.display = 'none';
}

async function doLogin(){
  const name = gid('l-user').value.trim(); const pw = gid('l-pw').value; const err = gid('e-login'); err.textContent = '';
  if(!name || !pw){ err.textContent = '请填写账号密码'; return; }
  try{ const resp = await fetch('../'+encodeURIComponent(name)+'/密码.txt',{cache:'no-store'}); if(resp.ok){ const txt = (await resp.text()).trim(); if(txt === pw){ saveLoginUser({name,color:'#cc0000',type:'creator'}); closePop(); showToast('登录成功'); return; }else{ err.textContent = '密码错误'; return; } } }catch(e){}
  const all = getUsers(); const found = all.find(x => (x.mail === name || x.name === name) && x.pw === pw);
  if(found){ saveLoginUser({name:found.name,color:found.color,type:'user'}); closePop(); showToast('登录成功'); }
  else err.textContent = '账号不存在或密码错误';
}

let _vcode='', _vexp=0, _rname='', _rpw='';
function doSend(){
  const mail = gid('r-mail').value.trim(); const name = gid('r-name').value.trim(); const phone = gid('r-phone').value.trim(); const pw = gid('r-pw').value; const err = gid('e-reg'); err.textContent = '';
  if(!mail || !name || !pw){ err.textContent = '请填写完整信息'; return; }
  if(phone && !/^1[3-9]\d{9}$/.test(phone)){ err.textContent = '手机号格式不正确'; return; }
  if(pw.length < 6){ err.textContent = '密码至少6位'; return; }
  if(getUsers().some(x => x.mail === mail)){ err.textContent = '该邮箱已注册'; return; }
  if(getUsers().some(x => x.name === name)){ err.textContent = '该昵称已被占用'; return; }
  if(phone && getUsers().some(x => x.phone === phone)){ err.textContent = '该手机号已注册'; return; }
  _vcode = String(Math.floor(100000 + Math.random() * 900000)); _vexp = Date.now() + 300000; _rname = name; _rpw = pw;
  gid('v-tip').style.display = 'block'; gid('v-tip').textContent = '演示验证码：' + _vcode;
  gid('r-code').style.display = 'block'; gid('r-go').style.display = 'block';
}
function doReg(){
  const code = gid('r-code').value.trim(); const err = gid('e-reg');
  if(!_vcode) return; if(Date.now() > _vexp){ err.textContent = '验证码已过期'; return; } if(code !== _vcode){ err.textContent = '验证码错误'; return; }
  const colors = ['#065fd4','#137333','#e37400','#8e24aa','#0097a7','#cc0000']; const color = colors[Math.floor(Math.random()*colors.length)];
  const all = getUsers(); all.push({mail:mail,name:_rname,phone:gid('r-phone').value.trim(),pw:_rpw,color}); saveUsers(all); saveLoginUser({name:_rname,color,type:'user'}); closePop(); showToast('注册成功！');
}
function doLogout(){ saveLoginUser(null); showToast('已退出'); }

function doSearch(){
  const key = gid('searchText').value.trim();
  if(key) location.href = '../index.html?q=' + encodeURIComponent(key);
  else location.href = '../index.html';
}

function shareChannel(){
  const shareUrl = window.location.href;
  if(navigator.share){
    navigator.share({title: "the1234556789 频道 | Project Pioneer", url: shareUrl});
  } else {
    navigator.clipboard.writeText(shareUrl).then(() => showToast('链接已复制！'));
  }
}

function renderVideo(){
  const videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");
  // 按 up 或 author 匹配
  const myVideos = videos.filter(v => v.up === "the1234556789" || v.author === "the1234556789");
  const grid = gid('videoGrid');

  if(myVideos.length === 0){
    grid.innerHTML = '<div class="empty">该作者暂无视频</div>';
    return;
  }

  let html = '';
  myVideos.forEach(v => {
    const isBili = v.type === 'bilibili' && v.bvid;
    html += `<div class="video-card" onclick="location.href='../${v.page}'">
      <div class="thumb">${isBili ? `<iframe src="https://player.bilibili.com/player.html?bvid=${v.bvid}&page=1&autoplay=0&danmaku=0&as_wide=1&high_quality=0" scrolling="no" frameborder="0" allowfullscreen></iframe>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px;">本地视频</div>`}</div>
      <div class="info">
        <h4>${safeStr(v.title)}</h4>
        <p>${safeStr(v.up || v.author || 'the1234556789')}</p>
      </div>
    </div>`;
  });
  grid.innerHTML = html;
}

function initPage(){
  initDefaultVideo();

  // 频道头像和名字
  const chName = "the1234556789";
  gid('chName').textContent = chName;
  gid('chAvatar').textContent = chName.substring(0, 2);
  gid('chSub').textContent = '创作者频道 · 纯前端视频平台';

  // 从用户列表取颜色
  const allUsers = getUsers();
  const me = allUsers.find(x => x.name === chName);
  if(me) gid('chAvatar').style.background = me.color;

  renderBar();
  renderVideo();

  // URL 参数搜索回填
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if(q) gid('searchText').value = q;

  gid('pop').addEventListener('click', e => { if(e.target === gid('pop')) closePop(); });
}

initPage();
</script>
</body>
</html>
