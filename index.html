<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Pioneer</title>
<style>
* { margin:0; padding:0; box-sizing: border-box; }
body { font-family: Roboto, Arial, "PingFang SC", sans-serif; background: #0f0f0f; color: #f1f1f1; }

/* 顶栏 */
header {
  position: sticky; top: 0; z-index: 10;
  height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px;
  background: #0f0f0f; border-bottom: 1px solid #222;
}
.left, .right { display: flex; align-items: center; gap: 16px; }
.logo { color: #ff0000; font-size: 20px; font-weight: 700; letter-spacing: -1px; text-decoration: none; }
.search { display: flex; flex:1; max-width: 600px; margin: 0 24px; }
.search input {
  flex: 1; height: 40px; border: 1px solid #303030;
  border-radius: 20px 0 0 20px; background: #121212;
  color: #fff; padding: 0 16px; outline: none; font-size: 14px;
}
.search button {
  width: 64px; border: 1px solid #303030; border-left: none;
  border-radius: 0 20px 20px 0; background: #222; color: #fff; cursor: pointer; font-size: 16px;
}
.search button:hover { background: #333; }

/* 顶栏按钮 */
.btn-login { padding: 6px 14px; border: 1px solid #3ea6ff; background: none; color: #3ea6ff; border-radius: 16px; cursor: pointer; font-size: 13px; }
.btn-login:hover { background: #1a3a5c; }
.btn-reg { padding: 6px 10px; border: none; background: none; color: #3ea6ff; cursor: pointer; font-size: 13px; }
.btn-reg:hover { background: #222; border-radius: 12px; }
.u-chip { display: flex; align-items: center; gap: 8px; }
.u-chip a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
.u-avatar { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; }
.u-name { font-size: 14px; }
.u-badge { font-size: 10px; background: #4a0000; color: #ff6b6b; padding: 1px 6px; border-radius: 8px; }
.btn-out { padding: 4px 10px; border: 1px solid #444; background: none; color: #fff; border-radius: 12px; cursor: pointer; font-size: 12px; }
.btn-out:hover { background: #222; }

/* 侧边栏 */
.layout { display: flex; }
aside { width: 240px; height: calc(100vh - 56px); padding: 12px; border-right: 1px solid #222; flex-shrink: 0; }
.nav-item { display: flex; align-items: center; gap: 16px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.nav-item:hover { background: #222; }
.nav-item.active { background: #272727; font-weight: 600; }

/* 主区 */
main { flex: 1; padding: 24px; }
.chips { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.chip { padding: 8px 12px; background: #272727; border-radius: 8px; font-size: 14px; cursor: pointer; color: #fff; }
.chip.active { background: #f1f1f1; color: #0f0f0f; font-weight: 500; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card .thumb { aspect-ratio: 16/9; border-radius: 12px; background: linear-gradient(135deg,#303030,#1a1a1a); position: relative; cursor: pointer; }
.card .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); font-size: 12px; padding: 2px 4px; border-radius: 4px; }
.meta { display: flex; gap: 12px; margin-top: 12px; }
.meta .av { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; cursor: pointer; }
.meta h4 { font-size: 14px; line-height: 1.3; color: #fff; }
.meta p { font-size: 12px; color: #aaa; margin-top: 4px; }

/* 弹窗 */
.mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; }
.mask.on { display: flex; }
.pop { background: #1a1a1a; border-radius: 12px; padding: 24px; width: 90%; max-width: 360px; border: 1px solid #333; }
.pop h2 { margin-bottom: 16px; font-size: 16px; color: #fff; }
.tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid #333; }
.tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; color: #aaa; border-bottom: 2px solid transparent; font-size: 14px; }
.tab.sel { color: #3ea6ff; border-bottom-color: #3ea6ff; font-weight: 500; }
.pnl { display: none; }
.pnl.on { display: block; }
.pop input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #444; border-radius: 8px; font-size: 14px; outline: none; background: #121212; color: #fff; box-sizing: border-box; }
.pop input:focus { border-color: #3ea6ff; }
.pop .go { width: 100%; padding: 10px; background: #3ea6ff; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.pop .go:hover { background: #2d8fe6; }
.err { color: #ff6b6b; font-size: 12px; margin-bottom: 8px; min-height: 14px; }
.info { font-size: 12px; color: #3ea6ff; margin-bottom: 8px; padding: 8px; background: #1a2a3a; border-radius: 6px; }

@media (max-width: 900px) { aside { display: none; } .search { margin: 0 8px; } }
</style>
</head>
<body>

<!-- 登录/注册弹窗 -->
<div class="mask" id="pop">
  <div class="pop">
    <h2>登录</h2>
    <div class="tabs">
      <div class="tab sel" onclick="tab('login')">登录</div>
      <div class="tab" onclick="tab('reg')">注册</div>
    </div>
    <div class="pnl on" id="p-login">
      <div class="err" id="e-login"></div>
      <input id="l-user" placeholder="用户名 / 邮箱">
      <input id="l-pw" type="password" placeholder="密码">
      <button class="go" onclick="doLogin()">登录</button>
    </div>
    <div class="pnl" id="p-reg">
      <div class="err" id="e-reg"></div>
      <input id="r-mail" placeholder="邮箱">
      <input id="r-name" placeholder="昵称">
      <input id="r-pw" type="password" placeholder="密码（至少6位）">
      <button class="go" onclick="sendCode()">发送验证码</button>
      <div class="info" id="v-tip" style="display:none"></div>
      <input id="r-code" placeholder="6位验证码" style="display:none">
      <button class="go" id="r-go" onclick="doReg()" style="display:none">完成注册</button>
    </div>
  </div>
</div>

<!-- 顶栏 -->
<header>
  <div class="left">
    <span style="font-size:22px;cursor:pointer">☰</span>
    <a href="mc.html" class="logo">▶ Project Pioneer</a>
  </div>
  <div class="search">
    <input placeholder="搜索影片...">
    <button>🔍</button>
  </div>
  <div class="right" id="abar"></div>
</header>

<div class="layout">
  <aside>
    <div class="nav-item active">🏠 首页</div>
    <div class="nav-item">🔥 时下流行</div>
    <div class="nav-item">📺 订阅内容</div>
    <div class="nav-item">📚 媒体库</div>
    <div class="nav-item">⏱ 稍后观看</div>
    <div class="nav-item">👍 喜欢的视频</div>
    <div class="nav-item">🎵 Music</div>
    <div class="nav-item">⚙ 设置</div>
  </aside>

  <main>
    <div class="chips">
      <div class="chip active">全部</div>
      <div class="chip">音乐</div>
      <div class="chip">游戏</div>
      <div class="chip">前端开发</div>
      <div class="chip">直播</div>
      <div class="chip">新闻</div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
// ===== 工具 =====
var SK = 'pp_user', UK = 'pp_users';
function $(id){return document.getElementById(id);}
function safe(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ===== 用户 =====
function getCur(){return JSON.parse(localStorage.getItem(SK)||'null');}
function setCur(u){localStorage.setItem(SK,JSON.stringify(u));}
function rmCur(){localStorage.removeItem(SK);}
function allU(){return JSON.parse(localStorage.getItem(UK)||'[]');}

// ===== 顶栏 =====
function renderBar(){
  var u = getCur();
  if(u){
    $('abar').innerHTML =
      '<div class="u-chip"><a href="./' + u.name + '/' + u.name + '.html">' +
        '<div class="u-avatar" style="background:' + u.color + '">' + u.name[0] + '</div>' +
        '<span class="u-name">' + safe(u.name) + '</span>' +
        (u.type==='creator'?'<span class="u-badge">创作者</span>':'') +
      '</a></div>' +
      '<button class="btn-out" onclick="logout()">退出</button>';
  } else {
    $('abar').innerHTML =
      '<button class="btn-login" onclick="openPop()">登录</button>' +
      '<button class="btn-reg" onclick="openPop();tab(\'reg\')">注册</button>';
  }
}

function openPop(){ $('pop').classList.add('on'); tab('login'); }
function closePop(){ $('pop').classList.remove('on'); }

function tab(t){
  document.querySelectorAll('.tab')[0].className='tab'+(t==='login'?' sel':'');
  document.querySelectorAll('.tab')[1].className='tab'+(t==='reg'?' sel':'');
  $('p-login').className='pnl'+(t==='login'?' on':'');
  $('p-reg').className='pnl'+(t==='reg'?' on':'');
  $('e-login').textContent=''; $('e-reg').textContent='';
  $('l-user').value=''; $('l-pw').value='';
  $('r-mail').value=''; $('r-name').value=''; $('r-pw').value=''; $('r-code').value='';
  $('v-tip').style.display='none'; $('r-code').style.display='none'; $('r-go').style.display='none';
}

async function doLogin(){
  var n=$('l-user').value.trim(), p=$('l-pw').value;
  $('e-login').textContent='';
  if(!n||!p){$('e-login').textContent='请填写完整';return;}
  try{
    var r=await fetch('./'+encodeURIComponent(n)+'/密码.txt',{cache:'no-store'});
    if(r.ok){var t=(await r.text()).trim();if(t===p){setCur({name:n,color:'#cc0000',type:'creator'});closePop();renderBar();return;}else{$('e-login').textContent='密码错误';return;}}
  }catch(e){}
  var us=allU(),f=null;
  for(var i=0;i<us.length;i++){if(us[i].email===n&&us[i].pw===p){f=us[i];break;}}
  if(f){setCur({name:f.name,color:f.color,type:'user'});closePop();renderBar();}
  else{$('e-login').textContent='账号不存在或密码错误';}
}

var _vc='',_ve=0,_vn='',_vp='';
function sendCode(){
  var e=$('r-mail').value.trim(),n=$('r-name').value.trim(),p=$('r-pw').value;
  $('e-reg').textContent='';
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(e)){$('e-reg').textContent='邮箱格式不对';return;}
  if(!n){$('e-reg').textContent='填昵称';return;}
  if(p.length<6){$('e-reg').textContent='密码至少6位';return;}
  var us=allU();for(var i=0;i<us.length;i++){if(us[i].email===e){$('e-reg').textContent='已注册';return;}}
  _vc=String(Math.floor(100000+Math.random()*900000));_ve=Date.now()+300000;_vn=n;_vp=p;
  $('v-tip').style.display='block';$('v-tip').textContent='验证码：'+_vc+'（演示模式）';
  $('r-code').style.display='block';$('r-go').style.display='block';
}

function doReg(){
  var c=$('r-code').value.trim();
  if(!_vc)return;if(Date.now()>_ve){$('e-reg').textContent='过期';return;}
  if(c!==_vc){$('e-reg').textContent='验证码错';return;}
  var cs=['#3ea6ff','#137333','#e37400','#8e24aa','#0097a7','#cc0000'];
  var co=cs[Math.floor(Math.random()*cs.length)];
  var us=allU();us.push({email:$('r-mail').value.trim(),name:_vn,pw:_vp,color:co});
  localStorage.setItem(UK,JSON.stringify(us));
  setCur({name:_vn,color:co,type:'user'});_vc='';closePop();renderBar();
}

function logout(){rmCur();renderBar();}

// ===== 视频数据 =====
// 第1个是 index.html（本地播放页），其余跳 YouTube
var videos = [
  ["自制短片 - 项目完整演示", "the1234556789", "1000.9万次观看 · 今天", "04:22", "index.html"],
  ["10小时Lo-fi学习音乐", "CodeBeats", "12万次观看 · 2天前", "3:42:10", "https://www.youtube.com/watch?v=jfKfPfyJRdk"],
  ["React 2026 全栈实战", "前端日记", "8.9万次观看 · 5小时前", "18:24", "https://www.youtube.com/watch?v=dQw4w9WgXcQ"],
  ["泰山日出 4K 航拍", "TravelCN", "230万次观看 · 1周前", "6:08", "https://www.youtube.com/watch?v=ScMzIvxBSi4"],
  ["Python 自动化办公", "DataLab", "45万次观看 · 3天前", "24:51", "https://www.youtube.com/watch?v=rfscVS0vtbw"],
  ["猫咪合集 治愈向", "DailyPet", "67万次观看 · 1天前", "10:02", "https://www.youtube.com/watch?v=BQ9YtWSZdow"],
  ["CSS Grid 终极指南", "UI Tips", "3.2万次观看 · 8小时前", "15:37", "https://www.youtube.com/watch?v=rg7Fvvl3taU"],
  ["NBA 精彩集锦", "SportNow", "120万次观看 · 12小时前", "9:44", "https://www.youtube.com/watch?v=1d9jXJvLE6E"],
];

// ===== 渲染卡片 =====
var avColors = ['#3ea6ff','#137333','#e37400','#8e24aa'];

$('grid').innerHTML = videos.map(function(v, i) {
  var isExt = v[4].indexOf('http') === 0;
  var click = isExt
    ? "window.open('" + v[4] + "', '_blank')"
    : "location.href='" + v[4] + "'";
  return '<div class="card" onclick="' + click + '">' +
    '<div class="thumb"><span class="dur">' + v[3] + '</span></div>' +
    '<div class="meta">' +
      '<div class="av" style="background:' + avColors[i % 4] + '"></div>' +
      '<div><h4>' + v[0] + '</h4><p>' + v[1] + '<br>' + v[2] + '</p></div>' +
    '</div></div>';
}).join('');

// ===== 初始化 =====
renderBar();
$('pop').addEventListener('click', function(e){ if(e.target===$('pop')) closePop(); });
</script>
</body>
</html>
