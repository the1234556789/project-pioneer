<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Pioneer - 影片播放</title>
<meta name="description" content="原创影片播放平台，发布分享自制短片、教程视频">
<meta name="keywords" content="自制影片,短片,项目教程,原创视频">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #0f0f0f; }
.header { padding: 8px 24px; display: flex; align-items: center; gap: 16px; height: 56px; border-bottom: 1px solid #e5e5e5; background: #fff; }
.logo { font-size: 20px; font-weight: 700; color: #0f0f0f; text-decoration: none; letter-spacing: -0.5px; }
.logo span { color: #ff0000; }
.main { display: flex; max-width: 1800px; margin: 0 auto; padding: 24px; gap: 24px; }
.primary { flex: 1; min-width: 0; }
.secondary { width: 402px; flex-shrink: 0; }
.player { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
#localVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.video-info { padding: 12px 0; }
.video-title { font-size: 1.3rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; color: #0f0f0f; }
.video-stats { display: flex; gap: 8px; color: #606060; font-size: 0.9rem; margin-bottom: 12px; }
.video-stats span { white-space: nowrap; }
.channel { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e5e5e5; border-bottom: 1px solid #e5e5e5; margin-bottom: 16px; }
.channel-avatar { width: 40px; height: 40px; border-radius: 50%; background: #cc0000; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; }
.channel-name { font-weight: 500; font-size: 0.95rem; }
.channel-name a { color: #0f0f0f; text-decoration: none; }
.channel-name a:hover { color: #065fd4; }
.description { color: #0f0f0f; font-size: 0.9rem; line-height: 1.6; background: #f2f2f2; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag { background: #f2f2f2; color: #065fd4; padding: 4px 12px; border-radius: 16px; font-size: 0.8rem; text-decoration: none; }
.tag:hover { background: #065fd4; color: #fff; }
.rec-heading { font-size: 0.95rem; font-weight: 600; color: #0f0f0f; margin-bottom: 12px; }
.rec-card { display: flex; gap: 8px; text-decoration: none; color: inherit; margin-bottom: 8px; padding: 4px; border-radius: 8px; }
.rec-card:hover { background: #f2f2f2; }
.rec-thumb { position: relative; width: 168px; aspect-ratio: 16/9; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #222; }
.rec-duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.85); color: #fff; font-size: 0.7rem; padding: 1px 4px; border-radius: 4px; font-weight: 500; }
.rec-info { flex: 1; min-width: 0; padding-top: 2px; }
.rec-title { font-size: 0.85rem; font-weight: 500; color: #0f0f0f; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
.rec-author { font-size: 0.75rem; color: #606060; }
.footer { text-align: center; padding: 24px; color: #909090; font-size: 0.75rem; border-top: 1px solid #e5e5e5; margin-top: 40px; }
@media (max-width: 1024px) {
  .main { flex-direction: column; padding: 0; }
  .player { border-radius: 0; }
  .primary { padding: 0 16px; }
  .secondary { width: 100%; padding: 0 16px; }
}
</style>
</head>
<body>
<div class="header">
  <a href="/" class="logo">Project<span>Pioneer</span></a>
</div>
<div class="main">

        浏览器不支持播放本地影片

        </div>

这里是你的影片简介，发布影片时可以填写剧情、制作过程、更新说明。
支持换行书写，方便介绍短片内容。

        <div class="tags">

          <a class="tag" href="/search?q=项目教程">#项目教程</a>

    </div>

  <div class="secondary">
      <h2 class="rec-heading">更多创作者影片</h2>
      <a class="rec-card" href="/watch?v=video01">

        </div>
        <div class="rec-info">

      <a class="rec-card" href="/watch?v=video02">

</div>
<div class="footer">Project Pioneer 原创影片平台 · 自制影片发布分享</div>

<script>
// 自动计算发布时间
function timeAgo(timestamp){
    const now = Date.now();
    const diff = now - timestamp;
    const minute = 60 * 1000;
    const hour = minute * 60;
    const day = hour * 24;
    if(diff < minute) return "刚刚";
    else if(diff < hour) return Math.floor(diff / minute) + "分钟前";
    else if(diff < day) return Math.floor(diff / hour) + "小时前";
    else if(diff < day * 30) return Math.floor(diff / day) + "天前";
    else{
        const d = new Date(timestamp);
        return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    }
}
// 修改此处为你的影片发布时间
const publishTime = new Date("2026-07-30 15:20:00").getTime();
document.getElementById("timeText").innerText = timeAgo(publishTime);
// 视频源已固定为 demo.mp4，无需改动
const videoSource = "demo.mp4";
document.querySelector("#localVideo source").src = videoSource;
document.getElementById("localVideo").load();
</script>
</body>
</html>
