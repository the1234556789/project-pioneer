<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 - Project Pioneer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, "Microsoft YaHei", sans-serif; background: #f9f9f9; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { height: 56px; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 24px; gap: 16px; background: white; }
.logo { font-size: 20px; font-weight: bold; text-decoration: none; color: #000; cursor: pointer; }
.logo span { color: #ff0000; }
.spacer { flex: 1; }

.abtn { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; margin-right: 12px; }
.user-chip { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
.user-name { color: #5f6368; }
.btn-login-nav { background: #1a73e8; color: #fff; border: none; padding: 8px 20px; border-radius: 16px; font-size: 14px; cursor: pointer; margin-right: 8px; font-family: inherit; }
.btn-reg-nav { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; padding: 8px 20px; border-radius: 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-logout { background: none; border: 1px solid #dadce0; color: #5f6368; padding: 6px 14px; border-radius: 14px; font-size: 14px; cursor: pointer; font-family: inherit; }

.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
.err-code { font-size: 120px; font-weight: bold; color: #ddd; margin-bottom: 10px; }
.err-msg { font-size: 20px; color: #666; margin-bottom: 8px; }
.err-desc { font-size: 14px; color: #999; margin-bottom: 30px; text-align: center; }
.btn-home { padding: 12px 32px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; text-decoration: none; }
.btn-home:hover { background: #1558b0; }
.footer { text-align: center; padding: 24px; color: #aaa; font-size: 12px; border-top: 1px solid #ddd; }

/* 版权 */
.copyright { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #5f6368; background: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 200; }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" onclick="location.href='index.html'">Project<span>Pioneer</span></a>

</div>

<div class="main">

  <div class="err-msg">页面走丢了</div>
  <div class="err-desc">你访问的页面不存在或已被删除。<br>可能是链接拼错了，或者视频已被搬运走。</div>
  <a class="btn-home" href="index.html">回到首页</a>
</div>

<div class="footer">Project Pioneer · 404 页面</div>
<div class="copyright">©2024-2026 会泽工作室 版权所有</div>
