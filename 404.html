<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 页面不存在 | Project Pioneer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#0f0f0f;color:#fff;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#181818;position:sticky;top:0;z-index:99;gap:12px;flex-wrap:wrap;}
.logo{font-size:22px;font-weight:bold;color:#fff;text-decoration:none}
.nav a{color:#ddd;text-decoration:none;margin:0 10px;padding:6px 10px;border-radius:6px}
.nav a:hover{background:#272727}
.search-area{display:flex;gap:0px;align-items:center}
.search-input{padding:10px 14px;border:none;border-radius:20px 0 0 20px;width:240px;background:#121212;color:#fff;border:1px solid #333;outline:none}
.search-input:focus{border-color:#448aff}
.search-btn{background:#272727;color:#fff;border:none;padding:10px 14px;border-radius:0 20px 20px 0;cursor:pointer;transition:0.2s}
.search-btn:hover{background:#448aff}
.login-btn{padding:8px 16px;border-radius:20px;border:1px solid #448aff;background:transparent;color:#448aff;cursor:pointer}
.container{max-width:700px;margin:80px auto;text-align:center;padding:20px}
.back-home{display:inline-block;margin-top:24px;padding:10px 22px;background:#448aff;border-radius:8px;color:#fff;text-decoration:none}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1000}
.modal-box{background:#181818;padding:26px;border-radius:10px;width:min(360px,90%)}
.modal-box h3{margin-bottom:14px;}
.modal-box input{width:100%;padding:10px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:6px}
.btn-group{display:flex;gap:10px;margin-top:12px}
button{padding:9px;border-radius:6px;border:none;cursor:pointer}
.primary{background:#448aff;color:white}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">Project Pioneer</a>
<div class="nav">
<a href="index.html">首页</a>
<a href="upload.html">上传视频</a>
</div>
<div class="search-area">
<input class="search-input" id="searchText" placeholder="搜索视频...">
<button class="search-btn" onclick="doSearch()">搜索</button>
<button class="login-btn" onclick="openLogin()">登录 / 注册</button>
</div>
</header>

<div class="container">
<h1>404</h1>
<p>您访问的页面不存在，链接可能失效或已被移除</p>
<a class="back-home" href="index.html">返回首页</a>
</div>

<div class="modal" id="loginModal">
<div class="modal-box">
<h3>账号登录</h3>
<input id="username" placeholder="用户名">
<input id="pwd" type="password" placeholder="密码">
<div class="btn-group">
<button class="primary" onclick="login()">登录</button>
<button onclick="register()">注册账号</button>
<button onclick="closeLogin()">关闭</button>
</div>
</div>
</div>

<script>
function initDefaultVideo(){
let videos=JSON.parse(localStorage.getItem("videos")||"[]");
const exist=videos.find(v=>v.page==="dQw4w9WgXcQ.html");
if(!exist){
videos.push({
title:"开发者演示视频",
desc:"Project Pioneer官方演示",
page:"dQw4w9WgXcQ.html",
type:"local",
author:"the1234556789",
category:"all"
});
localStorage.setItem("videos",JSON.stringify(videos));
}
}
initDefaultVideo();

function getUrlParam(name){
  const params=new URLSearchParams(window.location.search);
  return params.get(name)||"";
}
function doSearch(){
  let key=document.getElementById("searchText").value;
  location.href="index.html?q="+encodeURIComponent(key);
}
function openLogin(){document.getElementById("loginModal").style.display="flex";}
function closeLogin(){document.getElementById("loginModal").style.display="none";}
function login(){
const name=document.getElementById("username").value.trim();
const pw=document.getElementById("pwd").value.trim();
const userList=JSON.parse(localStorage.getItem("users")||"[]");
const find=userList.find(u=>u.name===name&&u.pwd===pw);
if(find){
localStorage.setItem("nowUser",JSON.stringify(find));
alert("登录成功！");
closeLogin();
}else{
alert("用户名或密码错误");
}
}
function register(){
const name=document.getElementById("username").value.trim();
const pw=document.getElementById("pwd").value.trim();
if(!name||!pw){alert("用户名密码不能为空");return;}
let users=JSON.parse(localStorage.getItem("users")||"[]");
if(users.find(x=>x.name===name)){alert("用户名已存在");return;}
users.push({name,pw});
localStorage.setItem("users",JSON.stringify(users));
alert("注册完成，请登录");
}
document.getElementById("searchText").value=getUrlParam("q");
</script>
</body>
</html>
