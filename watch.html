<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观看 - Project Pioneer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, "Microsoft YaHei", sans-serif; background: #f9f9f9; padding-bottom: 80px; }
.topbar { height: 56px; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 24px; gap: 16px; position: sticky; top: 0; background: white; z-index: 100; }
.logo { font-size: 20px; font-weight: bold; text-decoration: none; color: #000; cursor: pointer; }
.logo span { color: #ff0000; }
.spacer { flex: 1; }
.abtn { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; margin-right: 12px; }
.user-chip { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
.user-name { color: #5f6368; }
.btn-login-nav { background: #1a73e8; color: #fff; border: none; padding: 8px 20px; border-radius: 16px; font-size: 14px; cursor: pointer; margin-right: 8px; font-family: inherit; }
.btn-reg-nav { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; padding: 8px 20px; border-radius: 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-logout { background: none; border: 1px solid #dadce0; color: #5f6368; padding: 6px 14px; border-radius: 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-logout:hover { background: #f1f3f4; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; }
.main-col { flex: 1; min-width: 0; }
.side-col { width: 320px; flex-shrink: 0; }
.player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.player-wrap iframe, .player-wrap video { width: 100%; height: 100%; border: none; }
.video-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
.video-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: #666; }
.up-info { display: flex; align-items: center; gap: 8px; }
.up-avatar { width: 36px; height: 36px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
.up-name { font-size: 14px; color: #333; font-weight: 500; }
.video-desc { background: #f1f3f4; border-radius: 8px; padding: 12px; font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 24px; white-space: pre-wrap; }
.comments-section { margin-top: 24px; }
.comments-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.comment-box { display: flex; gap: 12px; margin-bottom: 20px; }
.comment-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 16px; font-size: 14px; outline: none; resize: none; }
.comment-input:focus { border-color: #1a73e8; }
.comment-submit { background: #1a73e8; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
.comment-submit:hover { background: #1557b0; }
.comment-item { display: flex; gap: 12px; margin-bottom: 16px; }
.comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
.comment-body { flex: 1; }
.comment-author { font-size: 13px; font-weight: 500; color: #333; margin-bottom: 4px; }
.comment-text { font-size: 14px; color: #333; line-height: 1.5; }
.comment-time { font-size: 11px; color: #999; margin-top: 4px; }
.rec-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #333; }
.rec-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
.rec-thumb { width: 140px; height: 80px; background: #222; border-radius: 6px; flex-shrink: 0; overflow: hidden; }
.rec-thumb iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
.rec-info { flex: 1; min-width: 0; }
.rec-item-title { font-size: 13px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rec-item-author { font-size: 11px; color: #666; }
.rec-item-stats { font-size: 11px; color: #999; margin-top: 2px; }
.footer { text-align: center; padding: 24px; color: #aaa; font-size: 12px; border-top: 1px solid #ddd; margin-top: 40px; }
.upload-fab { position: fixed; right: 24px; bottom: 56px; background: #1a73e8; color: #fff; border: none; padding: 14px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.4); z-index: 150; display: none; }
.upload-fab:hover { background: #1557b0; }
.copyright { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #5f6368; background: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 200; }
@media (max-width: 900px) { .container { flex-direction: column; } .side-col { width: 100%; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" onclick="location.href='index.html'">Project<span>Pioneer</span></a>
  <div class="spacer"></div>
  <div class="user-area" id="abar"></div>
</div>

<div class="container">
  <div class="main-col" id="mainCol"></div>
  <div class="side-col">
    <div class="rec-title">推荐视频</div>
    <div id="recList"></div>
  </div>
</div>

<div class="footer">Project Pioneer · 纯前端演示项目</div>
<button class="upload-fab" id="uploadFab" onclick="location.href='upload.html'">＋ 上传视频</button>
<div class="copyright">©2024-2026 会泽工作室 版权所有</div>

<script src="https://the1234556789.github.io/project-pioneer/auth.js"></script>
<script>
const STORAGE_VIDEOS = "pp_videos";
const STORAGE_COMMENTS = "pp_comments";

function gid(id){ return document.getElementById(id); }
function safeStr(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function getParam(name){
  return new URLSearchParams(location.search).get(name);
}

const currentPage = getParam('page');
let currentVideo = null;

function loadVideo(){
  const videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");
  currentVideo = videos.find(v => v.page === currentPage);
  
  if (!currentVideo) {
    gid('mainCol').innerHTML = '<div style="padding:40px;text-align:center;color:#666;">视频不存在或已被删除</div>';
    return;
  }

  document.title = currentVideo.title + ' - Project Pioneer';

  let playerHtml = '';
  if (currentVideo.type === 'bilibili' && currentVideo.bvid) {
    playerHtml = `<iframe src="https://player.bilibili.com/player.html?bvid=${currentVideo.bvid}&page=1&autoplay=0&danmaku=0&as_wide=1&high_quality=0" scrolling="no" frameborder="0" allowfullscreen></iframe>`;
  } else if (currentVideo.type === 'youtube' && currentVideo.ytid) {
    playerHtml = `<iframe src="https://www.youtube.com/embed/${currentVideo.ytid}" frameborder="0" allowfullscreen></iframe>`;
  } else if (currentVideo.type === 'local' && currentVideo.videoSrc) {
    playerHtml = `<video src="${currentVideo.videoSrc}" controls autoplay></video>`;
  } else {
    playerHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:12px;"><div style="font-size:16px;">📹 本地视频</div><div style="font-size:13px;color:#aaa;">视频文件未上传，请联系UP主</div></div>`;
  }

  gid('mainCol').innerHTML = `
    <div class="player-wrap">${playerHtml}</div>
    <div class="video-title">${safeStr(currentVideo.title)}</div>
    <div class="video-meta">
      <div class="up-info">
        <div class="up-avatar">${(currentVideo.up || currentVideo.author || '?').charAt(0).toUpperCase()}</div>
        <div class="up-name">${safeStr(currentVideo.up || currentVideo.author || '未知')}</div>
      </div>
      <span>${safeStr(currentVideo.plays || '')} · ${currentVideo.date || ''}</span>
    </div>
    <div class="video-desc">${safeStr(currentVideo.desc || '暂无描述')}</div>
    <div class="comments-section" id="commentsSection"></div>
  `;

  renderComments();
}

function renderComments(){
  if (!currentVideo) return;
  const section = gid('commentsSection');
  const comments = JSON.parse(localStorage.getItem(STORAGE_COMMENTS) || "[]")
    .filter(c => c.page === currentPage);

  section.innerHTML = `
    <div class="comments-title">评论 ${comments.length}</div>
    <div class="comment-box">
      <div class="up-avatar">${AUTH.getUser() ? AUTH.getUser().username.charAt(0).toUpperCase() : '?'}</div>
      <textarea class="comment-input" id="commentInput" placeholder="${AUTH.getUser() ? '写下你的评论...' : '请先登录后评论'}"></textarea>
      <button class="comment-submit" onclick="submitComment()">发送</button>
    </div>
    <div id="commentList"></div>
  `;

  const list = gid('commentList');
  comments.forEach(c => {
    const item = document.createElement('div');
    item.className = 'comment-item';
    item.innerHTML = `<div class="comment-avatar">${c.author.charAt(0).toUpperCase()}</div><div class="comment-body"><div class="comment-author">${safeStr(c.author)}</div><div class="comment-text">${safeStr(c.text)}</div><div class="comment-time">${c.time}</div></div>`;
    list.appendChild(item);
  });
}

function submitComment(){
  if (!AUTH.getUser()){ alert('请先登录'); location.href = 'login/index.html'; return; }
  const input = gid('commentInput');
  const text = input.value.trim();
  if (!text){ alert('评论不能为空'); return; }
  const comments = JSON.parse(localStorage.getItem(STORAGE_COMMENTS) || "[]");
  comments.push({ page: currentPage, author: AUTH.getUser().username, text: text, time: new Date().toLocaleString('zh-CN') });
  localStorage.setItem(STORAGE_COMMENTS, JSON.stringify(comments));
  input.value = '';
  renderComments();
}

function renderRec(){
  const videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS) || "[]");
  const recList = gid('recList');
  recList.innerHTML = '';
  videos.filter(v => v.page !== currentPage).slice(0, 6).forEach(v => {
    const item = document.createElement('div');
    item.className = 'rec-item';
    item.onclick = () => location.href = `watch.html?page=${v.page}`;
    const isBili = v.type === 'bilibili' && v.bvid;
    item.innerHTML = `<div class="rec-thumb">${isBili ? `<iframe src="https://player.bilibili.com/player.html?bvid=${v.bvid}&page=1&autoplay=0&danmaku=0&as_wide=1&high_quality=0" scrolling="no" frameborder="0"></iframe>` : `<div style="width:100%;height:100%;background:#333;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;">本地</div>`}</div><div class="rec-info"><div class="rec-item-title">${safeStr(v.title)}</div><div class="rec-item-author">${safeStr(v.up || v.author || '未知')}</div><div class="rec-item-stats">${safeStr(v.plays || '')}</div></div>`;
    recList.appendChild(item);
  });
}

function initPage(){
  AUTH.renderBar();
  if (AUTH.getUser()){ gid('uploadFab').style.display = 'block'; }
  loadVideo();
  renderRec();
}
initPage();
</script>
</body>
</html>
